      <stop stop-color="#0B1720"/>
      <stop offset="1" stop-color="#0E2C2E"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#132833"/>
