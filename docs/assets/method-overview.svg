  <text x="528" y="335" fill="#F8FAFC" font-size="18" font-family="Arial, sans-serif" font-weight="700">Base Models</text>
  <text x="528" y="360" fill="#A5B4C3" font-size="15" font-family="Arial, sans-serif">Qwen 0.8B / 2B / 4B</text>
