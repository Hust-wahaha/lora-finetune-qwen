  <text x="528" y="423" fill="#F8FAFC" font-size="18" font-family="Arial, sans-serif" font-weight="700">Supervision Tracks</text>
  <text x="528" y="448" fill="#A5B4C3" font-size="15" font-family="Arial, sans-serif">modern_think</text>
  <text x="528" y="470" fill="#A5B4C3" font-size="15" font-family="Arial, sans-serif">classical_think</text>
  <text x="650" y="470" fill="#A5B4C3" font-size="15" font-family="Arial, sans-serif">structured_think</text>
  <rect x="506" y="500" width="266" height="72" rx="18" fill="#0F2230" stroke="#315268"/>
  <text x="528" y="531" fill="#F8FAFC" font-size="18" font-family="Arial, sans-serif" font-weight="700">Outputs of Interest</text>
  <text x="528" y="556" fill="#A5B4C3" font-size="15" font-family="Arial, sans-serif">accuracy, think length, style control</text>

  <rect x="876" y="178" width="330" height="420" rx="26" fill="url(#card)" stroke="#284356" stroke-width="2" filter="url(#shadow)"/>
  <text x="908" y="230" fill="#F8FAFC" font-size="26" font-family="Arial, sans-serif" font-weight="700">3. Benchmark Axis</text>
  <text x="908" y="270" fill="#CBD5E1" font-size="18" font-family="Arial, sans-serif">Unified protocol for horizontal comparison</text>
  <rect x="908" y="304" width="266" height="72" rx="18" fill="#0F2230" stroke="#315268"/>
  <text x="930" y="335" fill="#F8FAFC" font-size="18" font-family="Arial, sans-serif" font-weight="700">Answer Metrics</text>
  <text x="930" y="360" fill="#A5B4C3" font-size="15" font-family="Arial, sans-serif">rule-based accuracy / LLM-reviewed accuracy</text>
  <rect x="908" y="392" width="266" height="92" rx="18" fill="#102730" stroke="#315268"/>
  <text x="930" y="423" fill="#F8FAFC" font-size="18" font-family="Arial, sans-serif" font-weight="700">Think Compression</text>
  <text x="930" y="448" fill="#A5B4C3" font-size="15" font-family="Arial, sans-serif">think length / completeness / short-window behavior</text>
  <rect x="908" y="500" width="266" height="72" rx="18" fill="#0F2230" stroke="#315268"/>
  <text x="930" y="531" fill="#F8FAFC" font-size="18" font-family="Arial, sans-serif" font-weight="700">Protocol Discipline</text>
  <text x="930" y="556" fill="#A5B4C3" font-size="15" font-family="Arial, sans-serif">fixed decoding, same baseline, reproducible runs</text>

  <path d="M402 388C430 388 438 388 474 388" stroke="#94A3B8" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M804 388C832 388 840 388 876 388" stroke="#94A3B8" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="314" y="622" width="652" height="58" rx="18" fill="#0E2431" stroke="url(#accent)" stroke-width="2"/>
  <text x="344" y="658" fill="#F8FAFC" font-size="20" font-family="Arial, sans-serif" font-weight="700">Goal:</text>
  <text x="410" y="658" fill="#CBD5E1" font-size="20" font-family="Arial, sans-serif">maintain comparable answer quality while shortening and controlling think outputs</text>
</svg>
