  <text x="126" y="470" fill="#A5B4C3" font-size="15" font-family="Arial, sans-serif">classical_think</text>
  <text x="248" y="470" fill="#A5B4C3" font-size="15" font-family="Arial, sans-serif">structured_think</text>
  <rect x="104" y="500" width="266" height="72" rx="18" fill="#0F2230" stroke="#315268"/>
  <text x="126" y="531" fill="#F8FAFC" font-size="18" font-family="Arial, sans-serif" font-weight="700">Difficulty Layers</text>
  <text x="126" y="556" fill="#A5B4C3" font-size="15" font-family="Arial, sans-serif">elementary / middle / high / long-process</text>

  <rect x="474" y="178" width="330" height="420" rx="26" fill="url(#card)" stroke="#284356" stroke-width="2" filter="url(#shadow)"/>
