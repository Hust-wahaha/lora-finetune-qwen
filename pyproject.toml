[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hust-wahaha-lora-finetune-qwen"
version = "0.1.0"
description = "中文数学应用题 LoRA 微调实验仓库"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "accelerate==1.13.0",
  "datasets==3.6.0",
  "einops==0.8.2",
  "huggingface-hub",
  "ms-swift==4.1.3",
  "numpy==2.4.4",
  "peft==0.19.1",
  "protobuf==7.34.1",
  "pydantic==2.12.3",
  "safetensors==0.7.0",
  "sentencepiece==0.2.1",
  "tensorboard==2.20.0",
  "tokenizers==0.22.2",
  "torch==2.11.0+cu130",
  "tqdm==4.67.3",
  "transformers==5.6.2",
  "trl==0.29.1",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
